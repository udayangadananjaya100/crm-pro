# ═══════════════════════════════════════════════
# Pro CRM — Production Deployment
# ═══════════════════════════════════════════════

services:
  app:
    build: .
    container_name: procrm_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://procrm_redis:6379
      - JWT_SECRET=changeme_production_secret_key
    volumes:
      - procrm_data:/app/data
      - procrm_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: procrm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  procrm_data:
  procrm_logs:
  redis_data:
